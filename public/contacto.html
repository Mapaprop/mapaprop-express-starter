<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto</title>
  <meta name="description" content="Nuestros teléfonos, direcciones y sucursales.">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
</head>
<body>
  <main class="wrap section">
    <h1>Contacto</h1>
    <p class="card__zone" data-brand-contact></p>

    <div class="detail" style="margin-top:2rem">
      <div>
        <h2>Nuestras sucursales</h2>
        <div class="branches" id="branches"></div>

        <section class="section">
          <h2>¿Buscás una propiedad en particular?</h2>
          <p>Si ya viste una propiedad en el sitio, consultá desde su ficha: así tu consulta nos llega
             junto con los datos de esa propiedad y te respondemos más rápido.</p>
          <a class="btn btn--primary" href="propiedades.html">Ver las propiedades</a>
        </section>
      </div>

      <aside class="aside">
        <form class="form" id="generic-contact">
          <h3>Escribinos</h3>
          <div><label for="c-name">Nombre</label><input id="c-name" required minlength="3"></div>
          <div><label for="c-email">Email</label><input id="c-email" type="email"></div>
          <div><label for="c-phone">Teléfono</label><input id="c-phone" type="tel"></div>
          <div><label for="c-branch">Sucursal</label><select id="c-branch"></select></div>
          <div><label for="c-message">Mensaje</label><textarea id="c-message" required></textarea></div>
          <button class="btn btn--primary" type="submit">Enviar</button>
          <p class="form__hint" id="c-hint"></p>
        </form>
      </aside>
    </div>
  </main>
  <script type="module" src="js/contacto.js"></script>
</body>
</html>
