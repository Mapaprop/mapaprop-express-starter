<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="contact.docTitle">Contacto</title>
  <meta name="description" data-i18n-content="contact.docDescription" content="Nuestros teléfonos, direcciones y sucursales.">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
</head>
<body>
  <main class="wrap section">
    <h1 data-i18n="contact.title">Contacto</h1>
    <p class="card__zone" data-brand-contact></p>

    <div class="detail" style="margin-top:2rem">
      <div>
        <h2 data-i18n="contact.branches">Nuestras sucursales</h2>
        <div class="branches" id="branches"></div>

        <section class="section">
          <h2 data-i18n="contact.lookingForTitle">¿Buscás una propiedad en particular?</h2>
          <p data-i18n="contact.lookingForText">Si ya viste una propiedad en el sitio, consultá desde su ficha: así tu consulta nos llega junto con los datos de esa propiedad y te respondemos más rápido.</p>
          <a class="btn btn--primary" href="propiedades.html" data-i18n="contact.seeProperties">Ver las propiedades</a>
        </section>
      </div>

      <aside class="aside">
        <form class="form" id="generic-contact">
          <h3 data-i18n="contact.formTitle">Escribinos</h3>
          <div><label for="c-name" data-i18n="contact.name">Nombre</label><input id="c-name" required minlength="3"></div>
          <div><label for="c-email" data-i18n="contact.email">Email</label><input id="c-email" type="email"></div>
          <div><label for="c-phone" data-i18n="contact.phone">Teléfono</label><input id="c-phone" type="tel"></div>
          <div><label for="c-branch" data-i18n="contact.branch">Sucursal</label><select id="c-branch"></select></div>
          <div><label for="c-message" data-i18n="contact.message">Mensaje</label><textarea id="c-message" required></textarea></div>
          <button class="btn btn--primary" type="submit" data-i18n="contact.submit">Enviar</button>
          <p class="form__hint" id="c-hint"></p>
        </form>
      </aside>
    </div>
  </main>
  <script type="module" src="js/contacto.js"></script>
</body>
</html>
